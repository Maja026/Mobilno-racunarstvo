<ion-header>
  <ion-toolbar color="primary">

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>My Ratings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let r of ratings">

      <ion-label>
        <h2>{{ moviesMap[r.movieId]?.title || 'Movie' }}</h2>
        <p>Rating: {{ r.rating }}</p>
        <p>{{ r.comment }}</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button color="warning" (click)="editRating(r)">Edit</ion-button>
        <ion-button color="danger" (click)="deleteRating(r)">Delete</ion-button>
      </ion-buttons>

    </ion-item>
  </ion-list>

</ion-content>
